name: Build Lunar VR APK

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile + Test + Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify hand tracking model asset
        run: |
          if [ ! -f app/src/main/assets/hand_landmarker.task ]; then
            echo "::error::hand_landmarker.task missing from assets"
            exit 1
          fi
          ls -la app/src/main/assets/hand_landmarker.task

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Report resolved dependency versions
        run: |
          ./gradlew :app:dependencies --configuration debugCompileClasspath 2>/dev/null \
            | grep -E "androidx\.camera|mediapipe|androidx\.activity|androidx\.core:core" | sort -u \
            | head -40 | while IFS= read -r line; do
              echo "::notice title=Resolved dependency::${line#*--- }"
            done || true

      - name: Run unit tests (math engine)
        run: |
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "=== Gradle errors (from /tmp/test.log) ==="
            grep -E "^e: |FAILURE:|What went wrong|> Task .* FAILED|AssertionError|junit.framework" /tmp/test.log | head -100 || true
            grep -E "^e: " /tmp/test.log | head -60 | while IFS= read -r line; do
              echo "::error title=Kotlin compile error::$line"
            done
            grep -E "AssertionError|failed" /tmp/test.log | head -30 | while IFS= read -r line; do
              echo "::error title=Test failure::$line"
            done
          fi
          exit $status

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "=== Gradle errors (from /tmp/build.log) ==="
            grep -E "^e: |FAILURE:|What went wrong|> Task .* FAILED|error:|AAPT" /tmp/build.log | head -100 || true
            grep -E "^e: |error:" /tmp/build.log | head -60 | while IFS= read -r line; do
              echo "::error title=Build error::$line"
            done
          fi
          exit $status

      - name: Show APK output
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
