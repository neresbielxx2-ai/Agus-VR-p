name: Build Lunar VR APK

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile + Test + Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify hand tracking model asset
        run: |
          if [ ! -f app/src/main/assets/hand_landmarker.task ]; then
            echo "::error::hand_landmarker.task missing from assets"
            exit 1
          fi
          ls -la app/src/main/assets/hand_landmarker.task

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests (math engine)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Show APK output
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
